name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  app:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: DnD Cards ${{ github.ref_name }}
          releaseDraft: false
          generateReleaseNotes: true

  cli:
    name: CLI (${{ matrix.os }})
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: dnd-cards-cli-windows.zip
          - os: ubuntu-latest
            archive: dnd-cards-cli-linux.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p dnd-cards-core -p dnd-cards-cli

      - name: Build
        run: cargo build --release -p dnd-cards-cli

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/release/dnd-cards.exe pkg/
          Copy-Item -Recurse data pkg/data
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.archive }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir pkg
          cp target/release/dnd-cards pkg/
          cp -r data pkg/data
          tar -czf ${{ matrix.archive }} -C pkg .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
