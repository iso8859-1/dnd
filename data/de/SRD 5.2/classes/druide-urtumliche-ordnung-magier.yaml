name: 'Urtümliche Ordnung: Magier (Druide)'
description: Du kennst einen zusätzlichen Zaubertrick aus der Zauberliste des Druiden. Außerdem gibt dir deine mystische Verbindung mit der Natur einen Bonus auf deine Intelligenzwürfe (Arkane Kunde oder Naturkunde). Dieser Bonus entspricht deinem Weisheitsmodifikator (mindestens +1).
