id: tiefling-unholdisches-erbe
type: species_trait
name: Unholdisches Erbe (Tiefling)
lang: de
typ: Tiefling
species: Tiefling
description: 'Dein Erbe gewährt dir übernatürliche Fähigkeiten. Wähle ein Erbe in der Tabelle „Unholdisches Erbe“ aus. Du
  erhältst durch dieses Erbe den Vorzug für die 1. Stufe.

  Wenn du die 3. und 5. Charakterstufe erreichst, erlernst du einen Zauber eines höheren Grades wie in der Tabelle angegeben.
  Du hast diesen Zauber stets vorbereitet. Du kannst ihn einmal wirken, ohne einen Zauberplatz zu verbrauchen. Diese Fähigkeit
  erhältst du nach einer langen Rast zurück. Du kannst den Zauber auch mit einem beliebigen verfügbaren Zauberplatz des entsprechenden
  Grades wirken.

  Wähle eine der folgenden Optionen aus. Charisma, Intelligenz oder Weisheit ist dein Attribut zum Wirken der Zauber dieser
  Abstammungslinie (wähle das Attribut aus, wenn du dich für ein Erbe entscheidest).'
source_book: SRD 5.2.1
