id: drachenblutiger-drakonischer-flug
type: species_trait
name: Drakonischer Flug (Drachenblütiger)
lang: de
typ: Drachenblütiger
species: Drachenblütiger
description: Wenn du die 5. Charakterstufe erreichst, kannst du drakonische Magie kanalisieren, um vorübergehend fliegen zu
  können. Als Bonusaktion kannst du dir geisterhafte Flügel wachsen lassen, die zehn Minuten lang erhalten bleiben, oder bis
  du die Flügel verwirfst (keine Aktion erforderlich) oder kampfunfähig wirst. Mit den Flügeln hast du eine Flugbewegungsrate
  in Höhe deiner Bewegungsrate. Das Erscheinungsbild deiner Flügel entspricht der Energie deiner Odemwaffe. Du kannst dieses
  Merkmal erst nach einer langen Rast erneut verwenden.
source_book: SRD 5.2.1
