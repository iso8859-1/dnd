name: Felsengnom (Gnom)
lang: de
typ: Gnom · Gnomische Abstammung
species: Gnom
description: 'Du kennst die Zaubertricks Ausbessern und Taschenspielerei. Außerdem kannst du zehn Minuten mit dem Zaubertrick
  Taschenspielerei verbringen, um ein winziges Uhrwerkgerät (RK 5, 1 TP) zu bauen, beispielsweise ein Spielzeug, einen Anzünder
  oder eine Spieluhr. Bestimme die Funktion des Geräts, indem du einen Effekt von Taschenspielerei auswählst. Das Gerät erzeugt
  den Effekt, wann immer du – oder eine andere Kreatur – eine Bonusaktion ausführst, um es mit einer Berührung zu aktivieren.
  Wenn der ausgewählte Effekt Optionen aufweist, entscheidest du dich für eine dieser Optionen, wenn du das Gerät baust. Beispiel:
  Wenn du den Entfachen- und Löschen-Effekt des Zaubers auswählst, entscheidest du, ob das Gerät Feuer entfacht oder löscht
  – das Gerät tut nicht beides. Du kannst bis zu drei dieser Geräte gleichzeitig verfügbar haben. Jedes Gerät fällt entweder
  acht Stunden nach seiner Erschaffung oder dann auseinander, wenn du es mit einer Berührung (eine Verwenden-Aktion) zerlegst.'
source_book: SRD 5.2.1
