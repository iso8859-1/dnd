description: Du erlernst den Zauber Dunkelheit. Du hast diesen Zauber stets vorbereitet. Du kannst ihn einmal wirken, ohne
  einen Zauberplatz zu verbrauchen. Diese Fähigkeit erhältst du nach einer langen Rast zurück. Du kannst den Zauber auch mit
  einem beliebigen verfügbaren Zauberplatz des entsprechenden Grades wirken.
