id: elf-elfische-abstammung
type: species_trait
name: Elfische Abstammung (Elf)
lang: de
typ: Elf
species: Elf
description: 'Du bist Teil einer Abstammungslinie, die dir übernatürliche Fähigkeiten gewährt. Wähle eine Abstammung aus der
  Tabelle „Elfische Abstammungen“ aus. Du erhältst durch diese Linie den Vorzug für die 1. Stufe.

  Wenn du die 3. und 5. Charakterstufe erreichst, erlernst du einen Zauber eines höheren Grades wie in der Tabelle angegeben.
  Du hast diesen Zauber stets vorbereitet. Du kannst ihn einmal wirken, ohne einen Zauberplatz zu verbrauchen. Diese Fähigkeit
  erhältst du nach einer langen Rast zurück. Du kannst den Zauber auch mit einem beliebigen verfügbaren Zauberplatz des entsprechenden
  Grades wirken.

  Intelligenz, Weisheit oder Charisma ist dein Attribut zum Wirken der Zauber dieser Abstammungslinie (wähle das Attribut
  aus, wenn du dich für eine Linie entscheidest).'
source_book: SRD 5.2.1
