id: zwerg-steingespur
type: species_trait
name: Steingespür (Zwerg)
lang: de
typ: Zwerg
species: Zwerg
description: Als Bonusaktion erhältst du zehn Minuten lang Erschütterungssinn mit einer Reichweite von 18 Metern. Du musst
  dich auf einer steinernen Oberfläche befinden oder eine solche berühren, um den Erschütterungssinn nutzen zu können. Es
  kann sich um naturbelassenen oder bearbeiteten Stein handeln. Die Häufigkeit, mit der du diese Bonusaktion ausführen kannst,
  entspricht deinem Übungsbonus. Du erhältst alle verbrauchten Anwendungen nach einer langen Rast zurück.
source_book: SRD 5.2.1
